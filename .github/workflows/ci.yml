name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Check server.json matches package.json
        run: |
          node -e '
            const p = require("./package.json");
            const s = require("./server.json");
            if (s.name !== p.mcpName) throw new Error(`server.json name ${s.name} != mcpName ${p.mcpName}`);
            if (s.version !== p.version) throw new Error(`server.json version ${s.version} != package.json ${p.version}`);
            if (s.repository.url !== "https://github.com/Software-Consulting/mapiron-mcp") throw new Error("server.json repository url");
          '
